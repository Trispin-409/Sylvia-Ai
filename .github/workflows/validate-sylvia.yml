name: Validate Sylvia frontend

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, feat/coucou-style-companion]

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Type-check
        run: npm run lint
      - name: Unit tests
        run: npm test
      - name: Build frontend and gateway
        run: npm run build
