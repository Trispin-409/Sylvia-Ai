name: Validate Sylvia frontend

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, feat/coucou-style-companion]

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Type-check
        run: npm run lint
      - name: Build frontend and gateway
        run: npm run build
      - name: Set up Python for ADK tool tests
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run offline opportunity discovery tests
        working-directory: adk_backend_patch
        run: python -m unittest discover -s tests -v
